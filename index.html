<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Woordscore</title>
    <meta
      name="description"
      content="Voor groepen die Woordle spelen op woordle.nl en hun uitslag in WhatsApp delen. Woordscore telt die uitslagen op."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232E9B5F'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' text-anchor='middle' fill='white'%3EW%3C/text%3E%3C/svg%3E"
    />
    <!-- server/page.ts opens the start page of woordscore.nl to search engines; everything else stays out -->
    <meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai" />
    <!-- what a shared link shows; server/page.ts fills in the scoreboard's own name and address -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woordscore" />
    <meta property="og:title" content="Woordscore" />
    <meta
      property="og:description"
      content="Het scorebord voor groepen die Woordle spelen op woordle.nl."
    />
    <meta property="og:url" content="https://woordscore.nl/" />
    <meta property="og:image" content="https://woordscore.nl/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body data-mode="loading">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
