<!doctype html>
<!-- The picture a shared link shows (public/og.png, 1200 x 630). Make it again with:
     npm run og -->
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2")
          format("woff2-variations");
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0e1a16;
        color: #e7efea;
        font-family: "Bricolage Grotesque", sans-serif;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 64px;
        align-items: center;
        padding: 0 84px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 96px);
        gap: 10px;
      }
      .tile {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-weight: 800;
        font-size: 52px;
        color: #fff;
        background: #55635d;
      }
      .g {
        background: #36a869;
      }
      h1 {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      p {
        font-size: 36px;
        line-height: 1.3;
        color: #94a69d;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <span class="tile">W</span><span class="tile">O</span><span class="tile g">O</span
      ><span class="tile g">R</span><span class="tile">D</span> <span class="tile g">S</span
      ><span class="tile g">C</span><span class="tile g">O</span><span class="tile g">R</span
      ><span class="tile g">E</span>
    </div>
    <div>
      <h1>Woordscore</h1>
      <p>Het scorebord bij Woordle van woordle.nl</p>
    </div>
  </body>
</html>
